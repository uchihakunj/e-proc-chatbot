name: Continuous Deployment to VM

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-self-hosted:
    name: Deploy via Self-Hosted Runner on VM
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          clean: false

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Install Node.js UI Dependencies (Only if changed)
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '05_webui/nodejs/package'; then
            echo "package.json changed — running npm install..."
            cd 05_webui/nodejs
            npm install
          else
            echo "package.json unchanged — skipping npm install."
          fi

      - name: Update Python Dependencies (Only if requirements.txt changed)
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q 'requirements.txt'; then
            echo "requirements.txt changed — updating python dependencies..."
            PYTHON_BIN=""
            if [ -f ".venv/bin/python" ]; then PYTHON_BIN=".venv/bin/python";
            elif [ -f "/opt/eproc-chatbot/.venv/bin/python" ]; then PYTHON_BIN="/opt/eproc-chatbot/.venv/bin/python";
            else PYTHON_BIN="python3"; fi
            $PYTHON_BIN -m pip install -r requirements.txt
          else
            echo "requirements.txt unchanged — skipping pip install."
          fi

      - name: Sync Code to /opt/eproc-chatbot Deployment Directory
        run: |
          if [ -d "/opt/eproc-chatbot" ]; then
            echo "Syncing latest commit to /opt/eproc-chatbot..."
            rsync -av --exclude='.venv' --exclude='.env' --exclude='node_modules' --exclude='.git' --exclude='logs' ./ /opt/eproc-chatbot/ 2>/dev/null || cp -r 05_webui 06_voice *.py *.txt *.sh /opt/eproc-chatbot/ 2>/dev/null || true
          fi

      - name: Restart eProcurement Application Service
        run: |
          sudo systemctl restart eproc-chatbot.service & disown || true


