name: Continuous Deployment to VM

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-self-hosted:
    name: Deploy via Self-Hosted Runner on VM
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Sync Git Repository
        run: |
          git fetch origin master || true
          git reset --hard origin/master || true

      - name: Install Node.js UI Dependencies
        run: |
          cd 05_webui/nodejs
          npm install

      - name: Update Python Virtual Environment Dependencies
        run: |
          if [ -f ".venv/bin/python" ]; then
            .venv/bin/python -m pip install -r requirements.txt
          elif [ -f "/opt/eproc-chatbot/.venv/bin/python" ]; then
            /opt/eproc-chatbot/.venv/bin/python -m pip install -r requirements.txt
          else
            python3 -m pip install -r requirements.txt
          fi

      - name: Restart eProcurement Application Service
        run: |
          sudo systemctl restart eproc-chatbot.service || true

